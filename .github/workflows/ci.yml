name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Qualify with the same toolchain used for the deployed binaries.
          go-version: '1.27.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select short canonical temporary path
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            temp_root=/private/tmp/r2
          else
            temp_root=/tmp/r2
          fi
          mkdir -p "$temp_root"
          echo "TMPDIR=$temp_root" >> "$GITHUB_ENV"
      - name: Test with race detector
        # Packages share mDNS sockets and process fixtures on the runner.
        run: go test -race -p 1 ./...
      - name: Vet
        run: go vet ./...
